<!-- Черновик для просмотра и правок. В анкету и отчёт идёт только то,
     что между метками БЛОК-НАЧАЛО и БЛОК-КОНЕЦ. Всё остальное —
     обвязка, чтобы файл открывался отдельной страницей.
     Знаки мессенджеров вшиты в код как данные: отдельные файлы
     подключать не надо, окно остаётся автономным. -->
<style>
:root{
--c-ink:#1A1A1A;--c-ink3:#4B5563;--c-gr:#6B7280;--c-gr2:#9CA3AF;--c-gr3:#B6BCC4;
--c-ln:#E5E7EB;--c-bg:#F5F6F8;--c-white:#fff;
--c-g-500:#21A038;--c-b-300:#8FC7E8;--c-b-700:#2A6FAB;
--r:20px;--sh:0 2px 12px rgba(16,24,40,.06)}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,'SB Sans Text','Segoe UI',Roboto,Arial,sans-serif;
background:var(--c-bg);color:var(--c-ink);margin:0;padding:40px 16px 80px}
.wp{max-width:1080px;margin:0 auto}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
.sub{color:var(--c-gr);font-size:16px;margin:0 0 30px}
.демо{display:flex;align-items:center;gap:14px;margin:0 0 34px}
.демо-подпись{color:var(--c-gr);font-size:14px}
.fbi{display:flex;width:46px;height:46px;align-items:center;justify-content:center;
border:1px solid var(--c-ln);border-radius:14px;background:var(--c-white);
color:var(--c-ink3);box-shadow:var(--sh);cursor:pointer}
.fbi svg{width:22px;height:22px}
</style></head><body>

/* ═══════════ ОКНО «ПОДЕЛИТЬСЯ» ═══════════════════════════════════
   Одна геометрия с окном благодарности: ширина 500, радиус 20,
   крестик справа сверху, закрытие по Esc и по фону.
   Порядок правил: подложка → окно → заголовок → знаки → ссылка → низ.
   Знаки мессенджеров приведены к одному виду — скруглённый квадрат
   44×44, поэтому в ряду они одного веса. */

/* ── подложка и окно ── */
.shm{position:fixed;inset:0;z-index:90;display:none;
align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.shm.on{display:flex}
html.shm-стоп,html.shm-стоп body{overflow:hidden}
.shm,.shm *{box-sizing:border-box}
.shm-фон{position:fixed;inset:0;background:rgba(26,26,26,.55);
backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.shm-окно{position:relative;z-index:1;width:100%;max-width:500px;margin:auto;
background:var(--c-white);border-radius:var(--r);padding:34px 34px 30px;
box-shadow:0 18px 60px rgba(16,24,40,.28);text-align:center}
.shm-крестик{position:absolute;top:14px;right:16px;z-index:2;width:34px;height:34px;
border:0;border-radius:11px;background:rgba(16,24,40,.05);color:var(--c-gr);
font-size:22px;line-height:1;cursor:pointer;transition:background .18s,color .18s}
.shm-крестик:hover{background:rgba(16,24,40,.09);color:var(--c-ink)}

/* ── заголовок и слоган ── */
.shm-заголовок{font-size:21px;font-weight:600;letter-spacing:-.02em;
line-height:1.25;color:var(--c-ink3);margin-bottom:8px}
/* Название — имя собственное: с прописной и в кавычках. Строчное
   написание остаётся только внутри самого знака, в тексте так нельзя. */
.shm-марка{font-weight:700;color:var(--c-ink)}
.shm-слоган{max-width:26em;margin:0 auto;font-size:13.5px;line-height:1.6;color:var(--c-gr)}

/* ── ряд знаков: только логотипы, подпись всплывает при наведении.
   Никакого движения — знаки стоят на месте, меняется только подсказка. ── */
.shm-ряд{display:flex;justify-content:center;gap:16px;margin-top:26px}
.shm-знак{position:relative;display:flex;align-items:center;justify-content:center;
width:44px;height:44px;padding:0;border:0;background:transparent;cursor:pointer}
.shm-знак img{display:block;width:44px;height:44px;border-radius:13px}
.shm-знак:active img{opacity:.85}

/* подсказка — та же светлая плашка, что у кнопок меню */
.shm-знак:after,.shm-копия:after{content:attr(data-подпись);position:absolute;
top:calc(100% + 9px);left:50%;transform:translateX(-50%) translateY(-4px);
padding:9px 13px;border-radius:12px;background:var(--c-white);color:var(--c-ink);
border:1px solid var(--c-ln);font-size:12.5px;font-weight:600;white-space:nowrap;
opacity:0;pointer-events:none;z-index:3;
box-shadow:0 8px 28px rgba(16,24,40,.16);transition:opacity .16s,transform .16s}
.shm-знак:hover:after{opacity:1;transform:translateX(-50%)}
.shm-копия:after{top:auto;bottom:calc(100% + 9px);transform:translateX(-50%) translateY(4px)}
.shm-копия:hover:after{opacity:1;transform:translateX(-50%)}

/* ── ссылка и отдельная кнопка копирования ── */
.shm-строка{display:flex;align-items:center;gap:10px;margin-top:24px}
.shm-поле{flex:1 1 auto;min-width:0;height:46px;padding:0 15px;
border:1.5px solid var(--c-ln);border-radius:13px;background:var(--c-white);
font-family:inherit;font-size:13.5px;color:var(--c-gr);
text-overflow:ellipsis;outline:none;cursor:text}
.shm-поле:focus{border-color:var(--c-b-300);color:var(--c-ink3)}
.shm-копия{position:relative;display:flex;align-items:center;justify-content:center;
width:46px;height:46px;flex:none;padding:0;border:1.5px solid var(--c-ln);
border-radius:13px;background:var(--c-white);color:var(--c-ink3);cursor:pointer;
transition:border-color .16s,color .16s}
.shm-копия svg{width:20px;height:20px}
.shm-копия:hover{border-color:var(--c-b-300);color:var(--c-b-700)}

@media(max-width:600px){
.shm{padding:14px}
.shm-окно{padding:28px 20px 26px}
.shm-заголовок{font-size:19px}
.shm-ряд{gap:12px}}
</style>

<style>
/* ── только для этого черновика: окно раскрыто сразу и подложка светлее.
   При переносе в анкету и отчёт эти два правила НЕ копируем. ── */
#shModal{display:flex}
#shModal .shm-фон{background:rgba(26,26,26,.35)}
</style>

<script>
/* ═══ ОКНО «ПОДЕЛИТЬСЯ» ═══
   ВКонтакте и Телеграм принимают ссылку прямо в адресе.
   У MAX такого адреса нет — мессенджер не даёт сайтам отправлять
   готовое сообщение. Поэтому для MAX вызываем системное окно
   «Поделиться»: если приложение установлено, оно будет в списке.
   Нет системного окна — просто копируем ссылку. */
(function(){
  var окно=document.getElementById('shModal'); if(!окно)return;
  var поле=document.getElementById('shmАдрес');

  function ссылка(){return location.href}
  function заголовок(){return document.title||'Счётикс — расчёт стоимости часа';}
  function показатьАдрес(){if(поле)поле.value=ссылка().replace(/^https?:\/\//,'')}
  показатьАдрес();

  function открыть(){
    окно.classList.add('on');
    document.documentElement.classList.add('shm-стоп');
    показатьАдрес();
  }
  function закрыть(){
    окно.classList.remove('on');
    document.documentElement.classList.remove('shm-стоп');
  }
  window.СЧХПоделиться=открыть;

  окно.querySelectorAll('[data-шзакрыть]').forEach(function(э){э.onclick=закрыть});
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&окно.classList.contains('on'))закрыть();
  });
  if(поле)поле.onclick=function(){this.select()};

  function тост(текст,вид){
    if(window.СЧХТост)СЧХТост(текст,вид); else alert(текст);
  }
  function копировать(тихо){
    var url=ссылка();
    var ок=function(){if(!тихо)тост('Ссылка скопирована')};
    var мимо=function(){тост('Не получилось скопировать — выделите адрес и скопируйте вручную','ошибка')};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(ок,мимо);
    }else if(поле){
      поле.removeAttribute('readonly'); поле.value=url; поле.select();
      try{document.execCommand('copy');ок()}catch(e){мимо()}
      поле.setAttribute('readonly','readonly'); показатьАдрес();
    }else{мимо()}
  }

  окно.querySelectorAll('[data-куда]').forEach(function(б){
    б.onclick=function(){
      var куда=б.getAttribute('data-куда');
      var url=encodeURIComponent(ссылка());
      var txt=encodeURIComponent(заголовок());
      if(window.ym&&window.YM_ID)ym(window.YM_ID,'reachGoal','share',{куда:куда});

      if(куда==='vk'){
        window.open('https://vk.com/share.php?url='+url+'&title='+txt,'_blank','noopener');
        закрыть(); return;
      }
      if(куда==='tg'){
        window.open('https://t.me/share/url?url='+url+'&text='+txt,'_blank','noopener');
        закрыть(); return;
      }
      if(куда==='max'){
        if(navigator.share){
          navigator.share({title:заголовок(),url:ссылка()}).then(закрыть,function(){});
        }else{
          копировать(true);
          тост('Ссылка скопирована — вставьте её в MAX');
          закрыть();
        }
        return;
      }
      копировать(); закрыть();
    };
  });

  var кнопка=document.getElementById('shDemo');
  if(кнопка)кнопка.onclick=открыть;
})();
</script>
</body></html>
